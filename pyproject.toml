[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ayakizi"
version = "0.1.0"
description = "Kendi e-posta kutunuzu ve SMS yedeğinizi tarayan kişisel dijital ayak izi denetim aracı"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ayakizi = "ayakizi.cli:main"

[tool.setuptools]
packages = ["ayakizi"]
